[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "sxbot"
version = "0.1.0"
description = "SX Bet bot that follows market-maker line moves instead of copy-trading wallets"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
trade = ["eth-account>=0.13"]
dev = ["pytest>=8"]

[project.scripts]
sxbot = "sxbot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"
